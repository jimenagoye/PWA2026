services:
  django:
    image: pwa2026tp2:0.1
    build: 
      context: ./backend/config/django-image
    volumes:
      - ./backend:/usr/src/app
    env_file:
      - .env-dist
    ports:
      - "8000:8000"
    networks:
      - red
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - red 

networks:
  red: